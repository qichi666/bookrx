name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # 类型 + 单测 + 枚举双向比对 + 风格门禁。
      # 四组都具备"扫描对象非空"的前提，所以在 M0 阶段就能真实地绿或红。
      - run: npm run check

      # 构建会触发 prebuild / postbuild 两道危机 chunk 断言
      - run: npm run build

      # 书目 / 版权 / 首屏体积三条数据闸门。
      # M0 阶段刻意没接：那时没有书目数据，它们会永远停在「未验证」——
      # 而一个恒定红色的门禁和「扫到 0 个就报通过」一样，都会让人不再看它。
      # 现在 68 本核心库 + 6551 本候选层已落地，它有了能真实变红的对象，才接。
      - run: npm run check:data

      # 真实浏览器冒烟（tools/smoke-browser.py）**刻意不进 CI**：
      # 它要多装一次 chromium（约 1 分钟 + 数百 MB），而网络抖动会让它红在基础设施上。
      # 本项目对"恒定红灯"的态度是明确的——那条路的终点一定是有人把门禁注释掉。
      # 所以它留在本地，作为改完 UI 后的一条手动命令（README 有写）。
