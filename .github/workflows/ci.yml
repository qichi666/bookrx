name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # 类型 + 单测 + 枚举双向比对 + 风格门禁。
      # 四组都具备"扫描对象非空"的前提，所以在 M0 阶段就能真实地绿或红。
      - run: npm run check

      # 构建会触发 prebuild / postbuild 两道危机 chunk 断言
      - run: npm run build

      # `npm run check:data`（书目 / 版权 / 体积三条闸门）在 M0.5 书目数据落地后接入。
      # 现在接入的话，它们会永远停在「未验证」——而一个恒定红色的门禁
      # 和「扫到 0 个就报通过」一样，都会让人不再看它。
      # - run: npm run check:data
