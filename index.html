<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP 走 meta 时，`frame-ancestors` 会被浏览器**忽略并报错**（它只能通过 HTTP 响应头生效）。
      留着这一条不会带来任何防护，只会让每个打开控制台的人先看到一条红色警告——
      于是真问题被这条噪声盖住。防点击劫持需要在托管侧发头：
        Content-Security-Policy: frame-ancestors 'none'
      GitHub Pages 不支持自定义响应头，所以当前部署形态下这项防护是**缺失**的，
      不是"已配置"。要补就得换支持 _headers 的托管（Cloudflare Pages / Netlify）或加反代。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <title>BookRx</title>
    <!-- 站点图标：不写这个的话浏览器会去请求 /favicon.ico，控制台里就是一条 404。 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      分享卡片：微信 / X / Slack / Discord / Telegram 抓的是这一组，不是页面正文。
      社交预览图必须是**绝对 URL**——抓取端不会按页面的相对 base 去解析图片路径。
      换域名或 fork 部署时，改下面 og:image 与 og:url 两行即可（其余与域名无关）。
      图就是仓库里那张 social-preview.png（1280×640，与 Settings → Social preview 同一张）。
    -->
    <meta
      name="description"
      content="说清此刻的困境，得到 5 本确实对味的书，每本说清为什么是它，能读的直接在页面里读。纯前端、无账号、无上报。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BookRx（书方）" />
    <meta
      property="og:description"
      content="说清此刻的困境，得到 5 本确实对味的书，每本说清为什么是它，能读的直接在页面里读。纯前端、无账号、无上报。"
    />
    <meta property="og:image" content="https://qichi666.github.io/bookrx/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:url" content="https://qichi666.github.io/bookrx/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
